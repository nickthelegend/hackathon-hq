name: CI

# Lint plus the Playwright suite (desktop 1280x800 and mobile 375x812) in Google Chrome against
# the production build. Runs on pull requests and on pushes to other branches; pushes to main run
# it through pages.yml, which deploys only when it passes.
on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
      - name: Install app and E2E dependencies
        run: npm ci --no-audit --no-fund && npm --prefix e2e ci --no-audit --no-fund
      - name: Lint (no warnings allowed)
        run: npm run lint
      - name: Google Chrome for the suite (preinstalled on ubuntu-latest; fail loudly if missing)
        run: google-chrome --version
      - name: Start the stack (npm run build, then vite preview on 127.0.0.1:4180)
        run: npm --prefix e2e run stack
      - name: E2E suite
        run: npm run test:e2e
      - name: Stop the stack
        if: always()
        run: npm --prefix e2e run stack:stop
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
